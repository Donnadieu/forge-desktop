name: Website
# The download page at https://donnadieu.github.io/forge-desktop/ (site/).
# The screenshots and the promo video come from docs/ at deploy time, so the page always shows the README's own files.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "docs/promo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the README's screenshots and promo video
        run: |
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/
          cp docs/promo/forge-desktop-promo.mp4 site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
